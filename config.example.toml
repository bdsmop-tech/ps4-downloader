# Copy to config.toml and fill in your values.

[ps4]
# Console IP (Settings → System → System Information)
host = "192.168.1.50"
# Your PC LAN IP (leave empty to auto-detect)
pc_host = ""
# GoldHEN BinLoader ports to try (default GoldHEN is 9090)
binloader_ports = [9090, 9191, 9021, 9020]
# Local HTTP port used to serve PKG to the console (must be reachable from PS4)
http_port = 9898
# GoldHEN FTP (for listing installed games). Default is 2121.
ftp_port = 2121
ftp_user = ""
ftp_password = ""

[download]
dir = "downloads"
resume = true

[queue]
file = "queue.txt"
