# Copy to config.toml and fill in your values.

[ps4]
host = "192.168.1.50"
# Your PC LAN IP (leave empty to auto-detect). Must be reachable FROM the PS4.
pc_host = ""
# auto = DPI order: use :12800 if open, else BinLoader :9090
install_method = "auto"
# Local HTTP port — PS4 downloads the PKG from here (DPI uses 9898)
http_port = 9898
# PC callback port patched into the DPI payload (DPI settings.ini PayloadPort)
# Often 9191 — allow this + http_port in Windows Firewall for python.exe
payload_port = 9191
# GoldHEN BinLoader on the console (default 9090)
binloader_ports = [9090, 9021, 9020]
ftp_port = 2121
ftp_user = ""
ftp_password = ""

[download]
dir = "downloads"
resume = true

[queue]
file = "queue.txt"
